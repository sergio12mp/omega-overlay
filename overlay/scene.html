<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Omega Overlay — escena 1920x1080</title>
<!--
  Escena completa para OBS (1920 x 1080): marco temático con hueco para el juego,
  equipo, objetos y medallas leídos solos desde Azahar.
  OBS > Fuente de navegador > http://localhost:8765/?layout=ele  > 1920 x 1080
  Opciones: layout=ele|barra|columna  style=magma|dex|clasico|cristal
            badges=placa|plano|escudo  item=icono|nombre|ambos|no  &preview  &demo
  Lo más cómodo es elegirlo en el panel: http://localhost:8765/panel
-->
<link rel="stylesheet" href="/overlay/theme.css">
<style>
  html,body{width:1920px;height:1080px;overflow:hidden}
  body.preview{background:#222}

  #bg{position:absolute;inset:0;overflow:hidden;
    background:
      radial-gradient(ellipse 55% 40% at 12% 100%, rgba(255,106,26,.55), transparent 70%),
      radial-gradient(ellipse 45% 45% at 92% 100%, rgba(255,60,20,.5), transparent 70%),
      radial-gradient(ellipse 70% 60% at 80% 0%, rgba(170,12,40,.85), transparent 75%),
      linear-gradient(160deg,#2a040c 0%,#5a0a1a 45%,#1d0309 100%)}
  body[data-style=dex] #bg{background:
      radial-gradient(ellipse 60% 50% at 15% 100%, rgba(40,200,255,.35), transparent 70%),
      radial-gradient(ellipse 70% 60% at 85% 0%, rgba(20,90,160,.8), transparent 75%),
      linear-gradient(160deg,#02121f 0%,#06304a 45%,#020b14 100%)}
  body[data-style=clasico] #bg{background:
      radial-gradient(ellipse 70% 60% at 85% 0%, rgba(200,16,46,.55), transparent 75%),
      linear-gradient(160deg,#3a3a44 0%,#1d1d24 100%)}
  body[data-style=cristal] #bg{background:linear-gradient(160deg,rgba(20,20,28,.55),rgba(40,40,52,.35))}
  #bg::before{content:"";position:absolute;inset:0;opacity:.18;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='100' viewBox='0 0 56 100'><path d='M28 66L0 50V16L28 0l28 16v34L28 66zM28 100L0 84V66m56 18L28 100' fill='none' stroke='%23ff8a4a' stroke-width='1.5'/></svg>");
    background-size:56px 100px}
  body:not([data-style=magma]) #bg::before{opacity:.07}
  .ember{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;
    background:radial-gradient(#ffd27a,#ff6a1a 60%,transparent 70%);animation:rise linear infinite;opacity:0}
  body:not([data-style=magma]) .ember{display:none}
  @keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-1100px) translateX(40px);opacity:0}}

  #frame{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}
  #hole{display:none;position:absolute;inset:0;background:#000}
  body.preview #hole{display:block}
  .hint{display:none;position:absolute;color:#7fffd4;font-size:18px;text-shadow:0 1px 3px #000}
  body.preview .hint{display:block}

  #zone{display:flex;gap:8px;padding:8px}
  #zone.col{flex-direction:column}
  #zone > .team,#zone > .badges{min-width:0;min-height:0}
  #status{position:absolute;right:8px;top:-22px}

  #head{position:absolute;display:flex;align-items:center;gap:28px;overflow:hidden}
  #head img{max-height:100%;max-width:70%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.8))}
  #logoText{font-size:56px;font-weight:800;letter-spacing:6px;text-transform:uppercase;
    background:linear-gradient(#ffe3a6,#ff7a2a 60%,#a0160f);-webkit-background-clip:text;
    background-clip:text;color:transparent;filter:drop-shadow(0 2px 3px #000);white-space:nowrap}
  #footer{font-size:26px;font-weight:700;letter-spacing:2px;text-shadow:0 2px 6px #000;color:var(--sub)}
</style>
</head>
<body>
<div id="hole"></div>
<div id="bg"></div>
<svg id="frame" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <radialGradient id="rv" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffe3a6"/><stop offset=".55" stop-color="#e0902b"/><stop offset="1" stop-color="#6a2a08"/></radialGradient>
    <linearGradient id="dvg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a040c"/><stop offset=".5" stop-color="#9a1428"/><stop offset="1" stop-color="#2a040c"/></linearGradient>
    <filter id="glow" x="-50%" y="-5%" width="200%" height="110%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="var(--zone-bd)" flood-opacity=".9"/></filter>
  </defs>
  <path id="pGlow" stroke="#ff6a1a" stroke-width="10" stroke-linejoin="round" filter="url(#glow)" opacity=".85"/>
  <path id="pDark" stroke="#3a0610" stroke-width="7" stroke-linejoin="round"/>
  <path id="pGold" stroke="#ffc86b" stroke-width="3" stroke-linejoin="round"/>
  <rect id="divider" fill="url(#dvg)" stroke="#ffc86b" stroke-width="3"/>
  <g id="rivets" stroke="#2a1008" stroke-width="2"></g>
</svg>
<div id="zone" class="zone"><div id="team"></div><div id="badges"></div><div id="status"></div></div>
<div class="hint" id="hint">VISTA PREVIA: el negro es donde va la captura de Azahar</div>
<div id="head"><img id="logoImg" alt=""><span id="logoText" style="display:none"></span><span id="footer"></span></div>

<script src="/overlay/core.js"></script>
<script src="/overlay/layouts.js"></script>
<script>
/* Texto opcional: ?titulo=Mi%20Nuzlocke&pie=Intentos:%203  — y tu logo.png junto al programa */
const { Q, opt } = OO;
const { CAPTURE, SCENES, placement } = OOLayouts;
OO.applyOptions(document.body);
if (Q.has("preview")) document.body.classList.add("preview");

const KEY = opt("layout", Object.keys(SCENES), "ele");
const L = SCENES[KEY];
document.body.dataset.layout = KEY;

/* --- colores del marco según el estilo --- */
const FRAME = {
  magma:   ["#ff6a1a", "#3a0610", "#ffc86b"],
  dex:     ["#28c8ff", "#021624", "#7ff0ff"],
  clasico: ["#c8102e", "#1b1b22", "#ffffff"],
  cristal: ["#ffffff", "#20202a", "#dcdce6"],
}[document.body.dataset.style];
["pGlow", "pDark", "pGold"].forEach((id, i) => document.getElementById(id).setAttribute("stroke", FRAME[i]));
document.getElementById("divider").setAttribute("stroke", FRAME[2]);
const stops = document.querySelectorAll("#dvg stop");
stops[0].setAttribute("stop-color", FRAME[1]); stops[2].setAttribute("stop-color", FRAME[1]);
stops[1].setAttribute("stop-color", FRAME[0]);
document.querySelector("#glow feDropShadow").setAttribute("flood-color", FRAME[0]);

/* --- captura de Azahar en el lienzo --- */
const P = placement(KEY), C = CAPTURE, T = C.top, B = C.bottom;
const mx = x => Math.round((P.x + x * P.s) * 10) / 10;
const my = y => Math.round((P.y + y * P.s) * 10) / 10;
const pts = [[T.x, T.y], [T.x + T.w, T.y], [T.x + T.w, B.y], [B.x + B.w, B.y],
  [B.x + B.w, B.y + B.h], [T.x + T.w, B.y + B.h], [T.x + T.w, T.y + T.h], [T.x, T.y + T.h]]
  .map(([x, y]) => [mx(x), my(y)]);
const holeStr = pts.concat([pts[0]]).map(p => `${p[0]}px ${p[1]}px`).join(",");
document.getElementById("bg").style.clipPath =
  `polygon(evenodd, 0px 0px,1920px 0px,1920px 1080px,0px 1080px,0px 0px,${holeStr})`;
document.getElementById("hole").style.clipPath = `polygon(${holeStr})`;

const rect = r => {
  const x0 = mx(r.x), y0 = my(r.y), x1 = mx(r.x + r.w), y1 = my(r.y + r.h);
  return { x0, y0, x1, y1, d: `M${x0} ${y0}L${x1} ${y0}L${x1} ${y1}L${x0} ${y1}Z` };
};
const rT = rect(T), rB = rect(B);
["pGlow", "pDark", "pGold"].forEach(id => document.getElementById(id).setAttribute("d", rT.d + rB.d));
const dv = document.getElementById("divider"), half = 10;
dv.setAttribute("x", rT.x1 - half); dv.setAttribute("width", half * 2);
dv.setAttribute("y", rT.y0); dv.setAttribute("height", rB.y1 - rT.y0);
const rv = document.getElementById("rivets");
[[rT.x0, rT.y0], [rT.x1, rT.y0], [rT.x1, rT.y1], [rT.x0, rT.y1],
 [rB.x0, rB.y0], [rB.x1, rB.y0], [rB.x1, rB.y1], [rB.x0, rB.y1]].forEach(([x, y]) => {
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 10); c.setAttribute("fill", "url(#rv)");
  rv.appendChild(c);
});
Object.assign(document.getElementById("hint").style, { left: (rT.x0 + 20) + "px", top: (rT.y0 + 20) + "px" });

/* --- zona de información --- */
const zone = document.getElementById("zone");
let Z = L.zone;
if (Z === "ele") {
  const pad = 14;
  Z = { x: mx(T.x + T.w) + pad, y: my(B.y + B.h) + pad,
        w: mx(B.x + B.w) - mx(T.x + T.w) - pad * 2, h: my(T.y + T.h) - my(B.y + B.h) - pad * 2 };
}
Object.assign(zone.style, { left: Z.x + "px", top: Z.y + "px", width: Z.w + "px", height: Z.h + "px" });
zone.classList.toggle("col", L.dir === "col");
const teamEl = document.getElementById("team"), badgesEl = document.getElementById("badges");
teamEl.style.flex = `0 0 calc(${L.split * 100}% - 4px)`;
badgesEl.style.flex = "1 1 0";

/* --- logo y textos en el hueco libre sobre la pantalla grande --- */
const head = document.getElementById("head");
const headH = Math.max(0, my(T.y) - 10);
Object.assign(head.style, { left: Math.max(20, P.x + 20) + "px", top: "6px",
  width: (mx(T.x + T.w) - Math.max(20, P.x + 20) - 20) + "px", height: headH + "px" });
if (headH < 40) head.style.display = "none";
const logoImg = document.getElementById("logoImg"), logoText = document.getElementById("logoText");
logoText.textContent = Q.get("titulo") || "Omega Ruby";
logoText.style.fontSize = Math.min(56, Math.round(headH * 0.55)) + "px";
logoImg.onerror = () => { logoImg.style.display = "none"; logoText.style.display = ""; };
logoImg.src = "/logo.png";
document.getElementById("footer").textContent = Q.get("pie") || "";

/* --- datos --- */
const renderTeam = OO.team(teamEl, L.team);
const renderBadges = OO.badges(badgesEl, L.badges);
const renderStatus = OO.status(document.getElementById("status"));
OO.start(st => { renderTeam(st.party); renderBadges(st.badges); renderStatus(st); });

/* --- brasas (solo magma) --- */
const bg = document.getElementById("bg");
for (let i = 0; i < 26; i++) {
  const e = document.createElement("div");
  e.className = "ember";
  e.style.left = Math.random() * 100 + "%";
  e.style.animationDuration = (7 + Math.random() * 9) + "s";
  e.style.animationDelay = (-Math.random() * 14) + "s";
  bg.appendChild(e);
}
</script>
</body>
</html>
