<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Omega Overlay — escena GBA 1920x1080</title>
<!--
  Escena completa para juegos de GBA (una sola pantalla 3:2), con tema Team Rocket.
  OBS > Fuente de navegador > http://localhost:8765/gba?layout=lateral  > 1920 x 1080
  Opciones: layout=lateral|inferior  badges=placa|plano|escudo  item=icono|nombre|ambos|no
            nombre=mote|especie|ambos  titulo=texto  pie=texto  &preview  &demo
  Debajo de esta fuente va la captura de mGBA (solo la imagen del juego).
-->
<link rel="stylesheet" href="/overlay/theme.css">
<style>
  html,body{width:1920px;height:1080px;overflow:hidden}
  body.preview{background:#333}
  #bg{position:absolute;inset:0;overflow:hidden;
    background:
      radial-gradient(ellipse 60% 70% at 100% 0%, rgba(160,10,24,.55), transparent 70%),
      radial-gradient(ellipse 50% 60% at 0% 100%, rgba(120,6,18,.45), transparent 70%),
      linear-gradient(135deg,#0d0d10 0%,#16161a 50%,#09090b 100%)}
  #bg::before{content:"";position:absolute;inset:0;opacity:.5;
    background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 22px)}
  #bg::after{content:"";position:absolute;right:-120px;bottom:-160px;width:760px;height:760px;opacity:.07;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,2 94,26 94,74 50,98 6,74 6,26' fill='none' stroke='%23ff2b3d' stroke-width='5'/><polygon points='50,16 82,33 82,67 50,84 18,67 18,33' fill='none' stroke='%23ff2b3d' stroke-width='2'/></svg>") center/contain no-repeat}
  #hole{display:none;position:absolute;background:#000}
  body.preview #hole{display:block}
  .hint{display:none;position:absolute;color:#7fffd4;font-size:20px;text-shadow:0 1px 3px #000}
  body.preview .hint{display:block}

  /* marco del juego: línea roja, esquinas en escuadra y una fina línea gris */
  #frame{position:absolute;pointer-events:none}
  #frame::before{content:"";position:absolute;inset:-6px;border:3px solid #d7182a;
    box-shadow:0 0 18px rgba(215,24,42,.55),inset 0 0 10px rgba(215,24,42,.4)}
  #frame::after{content:"";position:absolute;inset:-13px;border:1px solid rgba(200,200,210,.35)}
  .corner{position:absolute;width:46px;height:46px;border:6px solid #f4f4f6}
  .corner.tl{left:-16px;top:-16px;border-right:0;border-bottom:0}
  .corner.tr{right:-16px;top:-16px;border-left:0;border-bottom:0}
  .corner.bl{left:-16px;bottom:-16px;border-right:0;border-top:0}
  .corner.br{right:-16px;bottom:-16px;border-left:0;border-top:0}

  #zone{display:flex;gap:10px;padding:10px;border-radius:0;
    clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
  #zone.col{flex-direction:column}
  #zone > .team,#zone > .badges{min-width:0;min-height:0}
  #status{position:absolute;right:12px;bottom:6px}

  #head{position:absolute;display:flex;align-items:center;gap:22px;overflow:hidden}
  #head.v{flex-direction:column;justify-content:center;text-align:center;gap:26px}
  #emblem{flex:none;width:70px;height:70px}
  #head.v #emblem{width:180px;height:180px}
  #head img{max-height:100%;max-width:60%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.8))}
  #titles{display:flex;flex-direction:column;min-width:0}
  #logoText{font-size:52px;font-weight:900;letter-spacing:4px;text-transform:uppercase;line-height:1;
    color:#f4f4f6;text-shadow:3px 3px 0 #d7182a,0 0 18px rgba(215,24,42,.6);white-space:nowrap}
  #head.v #logoText{white-space:normal;font-size:46px}
  #footer{font-size:24px;font-weight:700;letter-spacing:3px;color:#ff3b4a;text-transform:uppercase;margin-top:6px}
  .stripe{position:absolute;height:6px;background:repeating-linear-gradient(90deg,#d7182a 0 40px,transparent 40px 52px)}
</style>
</head>
<body>
<div id="bg"></div>
<div id="hole"></div>
<div id="frame"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div>
<div id="zone" class="zone"><div id="team"></div><div id="badges"></div><div id="status"></div></div>
<div class="hint" id="hint">VISTA PREVIA: el negro es donde va la captura de mGBA</div>
<div id="head">
  <svg id="emblem" viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="50,3 93,27 93,73 50,97 7,73 7,27" fill="#0b0b0e" stroke="#d7182a" stroke-width="6"/>
    <polygon points="50,17 80,34 80,66 50,83 20,66 20,34" fill="#d7182a"/>
    <text x="50" y="63" text-anchor="middle" font-family="Arial Black,Trebuchet MS,sans-serif" font-size="34"
      font-weight="900" fill="#f4f4f6">TR</text>
  </svg>
  <img id="logoImg" alt="">
  <div id="titles"><span id="logoText"></span><span id="footer"></span></div>
</div>
<div class="stripe" id="stripe"></div>

<script src="/overlay/core.js"></script>
<script src="/overlay/layouts.js"></script>
<script>
const { Q, opt } = OO;
const { GBA_SCENES } = OOLayouts;
OO.applyOptions(document.body);
document.body.dataset.style = "rocket";
if (Q.has("preview")) document.body.classList.add("preview");

const KEY = opt("layout", Object.keys(GBA_SCENES), "lateral");
const L = GBA_SCENES[KEY];
const px = r => ({ left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" });

/* hueco del juego (transparente en OBS) y su marco */
const H = L.hole;
Object.assign(document.getElementById("hole").style, px(H));
Object.assign(document.getElementById("frame").style, px(H));
const holeStr = `${H.x}px ${H.y}px,${H.x + H.w}px ${H.y}px,${H.x + H.w}px ${H.y + H.h}px,${H.x}px ${H.y + H.h}px,${H.x}px ${H.y}px`;
document.getElementById("bg").style.clipPath =
  `polygon(evenodd, 0px 0px,1920px 0px,1920px 1080px,0px 1080px,0px 0px,${holeStr})`;
Object.assign(document.getElementById("hint").style, { left: H.x + 24 + "px", top: H.y + 24 + "px" });

/* zona del equipo y medallas */
const zone = document.getElementById("zone");
Object.assign(zone.style, px(L.zone));
zone.classList.toggle("col", L.dir === "col");
const teamEl = document.getElementById("team"), badgesEl = document.getElementById("badges");
teamEl.style.flex = `0 0 calc(${L.split * 100}% - 5px)`;
badgesEl.style.flex = "1 1 0";

/* cabecera: emblema, logo.png o título */
const head = document.getElementById("head");
Object.assign(head.style, px(L.head));
head.classList.toggle("v", !!L.vhead);
const stripe = document.getElementById("stripe");
if (L.vhead) Object.assign(stripe.style, { left: L.head.x + "px", top: L.head.y + L.head.h - 6 + "px", width: L.head.w + "px" });
else Object.assign(stripe.style, { left: L.zone.x + "px", top: L.head.y + L.head.h - 4 + "px", width: L.zone.w + "px" });
const logoImg = document.getElementById("logoImg"), logoText = document.getElementById("logoText");
const fixedTitle = Q.get("titulo");
logoText.textContent = fixedTitle || "Team Rocket Edition";
const setTitle = st => { if (!fixedTitle && st.game_name) logoText.textContent = st.game_name; };
logoImg.onerror = () => { logoImg.style.display = "none"; };
logoImg.src = "/logo.png";
document.getElementById("footer").textContent = Q.get("pie") || "";

/* datos */
const renderTeam = OO.team(teamEl, L.team);
const renderBadges = OO.badges(badgesEl, Object.assign({ set: "propias" }, L.badges));
const renderStatus = OO.status(document.getElementById("status"));
OO.start(st => { renderTeam(st.party); renderBadges(st.badges); renderStatus(st); setTitle(st); }, OO.DEMO_GBA);
</script>
</body>
</html>
