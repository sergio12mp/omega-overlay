name: release

# Al subir una etiqueta vX.Y.Z: tests, compilación del .exe y del instalador,
# y publicación en GitHub Releases. También se puede lanzar a mano (sin publicar).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: La versión de la etiqueta coincide con app.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Select-String -Path app.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "app.py dice $ver pero la etiqueta es ${{ github.ref_name }}" }

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Compilar
        shell: pwsh
        run: ./build/build.ps1

      - name: Zip portable
        shell: pwsh
        run: |
          $ver = (Select-String -Path app.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          Compress-Archive -Path dist/OmegaOverlay -DestinationPath "dist/OmegaOverlay-$ver-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: OmegaOverlay
          path: |
            dist/*-instalador.exe
            dist/*-portable.zip

      - name: Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*-instalador.exe, dist/*-portable.zip).FullName `
            --title "Omega Overlay ${{ github.ref_name }}" --generate-notes
